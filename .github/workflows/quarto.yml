name: foo
on: push
jobs:
  bar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      - run: pip install ipykernel nbclient matplotlib PyMPDATA open-atmos-jupyter-utils
      - run: sudo apt-get install -y librsvg2-bin
      - run: quarto render MUP_Tokarz.ipynb --to pdf --no-execute -M title="Symulacja propagacji fali powodziowej"
      - uses: actions/upload-artifact@v4
        with:
          path: MUP_Tokarz.pdf
