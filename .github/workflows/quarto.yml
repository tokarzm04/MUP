title: "Symulacja propagacji fali powodziowej"
author: "Mateusz Tokarz"
lang: pl

format:
  pdf:
    papersize: a4
    fontsize: 10pt
    geometry: margin=1.8cm
    number-sections: false

execute:
  echo: false
  warning: false

name: foo
on: push
jobs:
  bar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      - run: pip install ipykernel nbclient matplotlib PyMPDATA open-atmos-jupyter-utils
      - run: quarto render MUP_Tokarz.ipynb --to pdf --no-execute
      - uses: actions/upload-artifact@v4
        with:
          path: MUP_Tokarz.pdf
