name:foo
on:push
jobs:
  bar:
    runs_on:ubuntu_latest
    steps:
      -uses: actions/checkout@v7
      -uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex:true
      -run: pip install ipykernel nbclient matplotlib PyMPDATA
      -run: quarto gender MUP1.ipynb --to pdf --execute
      -uses: actions/upload_artifact@v7
        with:
          path: MUP1.pdf
